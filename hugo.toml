baseURL = "https://Biotin-2small.github.io/"
locale = "zh-cn"
title = "关注biotin喵，关注biotin谢谢喵"
theme = "PaperMod"

[params]
  author = "biotin"
  description = "分享技术、生活与思考"
  darkMode = "auto"
  search = true
  showSocialIcons = true
  # 其他已有配置...

  # 开启评论
  comments = true

  # 是否显示面包屑导航
  ShowBreadCrumbs = true

  # 是否显示文章阅读时间
  ShowReadingTime = true

  # 是否显示文章字数
  ShowWordCount = true

  # 是否显示分享按钮
  ShowShareButtons = true

  # 是否显示上一页/下一页
  ShowPostNavLinks = true

  # 是否显示代码复制按钮
  ShowCodeCopyButtons = true

  # 是否显示页面总数
  ShowPageNums = true

  # 是否显示文章作者
  ShowPostAuthors = true

  # 是否显示文章最后修改时间
  ShowLastMod = true

  # 是否在标题栏显示站点标题
  ShowSiteTitle = true

  # 是否显示页脚
  ShowFooter = true

  # 是否显示“回到顶部”按钮
  ShowBackToTop = true

  [params.giscus]
    repo = "Biotin-2small/Biotin-2small.github.io"
    repoID = "R_kgDOT3WVVg"          # 填入你的 repo-id
    category = "Announcements"    # 填入你的 category
    categoryID = "DIC_kwDOT3WVVs4DDXGU"    # 填入你的 category-id
    mapping = "pathname"
    reactionsEnabled = "1"
    emitMetadata = "0"
    inputPosition = "bottom"
    theme = "preferred_color_scheme"
    lang = "zh-CN"
[menu]
  [[menu.main]]
    name = "首页"
    url = "/"
    weight = 10
  [[menu.main]]
    name = "归档"
    url = "/archives/"
    weight = 20
  [[menu.main]]
    name = "搜索"
    url = "/search/"
    weight = 30
[outputs]
  home = ["HTML", "RSS", "JSON"]